name: credit-conveyor

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-credit_conveyor}
      POSTGRES_USER: ${POSTGRES_USER:-credit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-credit}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  wiremock:
    image: wiremock/wiremock:3.9.1
    restart: unless-stopped
    command: ["--global-response-templating", "--disable-banner"]
    ports:
      - "127.0.0.1:${WIREMOCK_PORT:-8089}:8080"
    volumes:
      - ./mocks/wiremock/mappings:/home/wiremock/mappings:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-credit_conveyor}
      DB_USER: ${POSTGRES_USER:-credit}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-credit}
      EGRUL_BASE_URL: http://wiremock:8080/egrul
      FNS_BASE_URL: http://wiremock:8080/fns
      BKI_BASE_URL: http://wiremock:8080/bki
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      LOGGING_LEVEL_ROOT: INFO
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      wiremock:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
