  /backoffice/applications/{id}/documents/{documentId}/content:
    get:
      tags: [Backoffice]
      summary: Скачать документ заявки (сотрудник банка)
      description: Список документов — в карточке (`documents`).
      operationId: downloadBackofficeDocument
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Файл
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /backoffice/applications/{id}/decision:
    post:
      tags: [Backoffice]
      summary: Ручное решение сотрудника банка
      description: |
        Разрешено в `MANUAL_REVIEW` и `PENDING_CONFIRMATION`; `COUNTER_OFFER` и `REJECT` — одноимённые статусы.

        `APPROVE` из `MANUAL_REVIEW` даёт оффер (`APPROVED`). Условия необязательны: не переданы — продукт, сумма
        и срок из заявки, ставка — из каталога (с подпиской или без, как в заявке). Продукт — только продукт заявки,
        другой продукт — через `COUNTER_OFFER`. `APPROVE` из `PENDING_CONFIRMATION` подтверждает принятые клиентом
        условия → `OFFER_ACCEPTED`, условия не передаются (другие условия — через `COUNTER_OFFER`).

        `COUNTER_OFFER`: обязательна сумма `amount`; продукт и срок не переданы — из заявки.

        Условия проверяются по условиям продукта (сумма, срок с учётом подписки заявки, возраст бизнеса) — иначе 400
        по полям `productCode`, `amount`, `term`. Лимит по финансам сотрудник может превысить, границы продукта — нет.
        `rate` — не ниже ставки каталога и не выше наибольшей ставки банка (настройка сервера), до сотых; комиссия
        за подписку — по каталогу. Оффер сотрудника не предварительный:
        клиент принимает его и сразу подписывает.

        Комментарий обязателен для `REJECT` и `COUNTER_OFFER` и показывается клиенту в причине решения
        (`MANUAL_REJECT`, `MANUAL_COUNTER_OFFER`) и в истории. `reasonCodes` — коды из справочника `reasonCodes`
        для учёта решения (другой код — 400 по `reasonCodes[i]`), клиенту не показываются.
      operationId: makeDecision
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualDecisionRequest'
            examples:
              counterOffer:
                value:
                  decision: COUNTER_OFFER
                  productCode: CREDIT_LINE
                  amount: '1500000.00'
                  term: 6
                  termUnit: MONTHS
                  rate: 25.50
                  comment: 'Две действующие кредитные линии, снижаем лимит'
              reject:
                value:
                  decision: REJECT
                  comment: 'Высокая долговая нагрузка'
                  reasonCodes: [DEBT_LOAD_HIGH]
              approve:
                value:
                  decision: APPROVE
                  comment: 'Просрочка погашена, обороты стабильные'
      responses:
        '200':
          description: Заявка после решения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /backoffice/applications/{id}/info-requests:
    post:
      tags: [Backoffice]
      summary: Запросить у клиента дополнительную информацию
      description: |
        Разрешено в `MANUAL_REVIEW`. Заявка переходит в `NEED_INFO`, клиент видит запрос в `openInfoRequest`.
        `requestedFields` — поля, которые клиент может изменить после отправки: `purpose`, `fundingMode`,
        `repaymentType`, `financials.*` (иначе 400 по `requestedFields[i]`). Ответ клиента возвращает заявку
        в `MANUAL_REVIEW`.
      operationId: createInfoRequest
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInfoRequest'
            example:
              message: Пришлите бухгалтерскую отчётность за последний год
              requestedFields: []
              requestedDocuments: [FINANCIAL_STATEMENT]
      responses:
        '201':
          description: Запрос создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ApplicationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductCode:
      name: code
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ProductCode'
    CompanyId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: Ошибка валидации
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://credit.example/problems/validation
            title: Ошибка валидации
            status: 400
            detail: Некоторые поля заполнены неверно
            errors:
              - { field: requestedAmount, message: 'Сумма должна быть не меньше 50 000 ₽' }
    Unauthorized:
      description: Нет токена или он недействителен
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Нет доступа (чужая заявка или не та роль)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Не найдено
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: |
        По `type`: `…/invalid-transition` — недопустимо в текущем статусе заявки;
        `…/concurrent-modification` — заявку только что изменили, обновите её и повторите действие.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidTransition:
              value:
                type: https://credit.example/problems/invalid-transition
                title: Действие недоступно
                status: 409
                detail: 'Нельзя принять предложение в статусе REJECTED'
            concurrentModification:
              value:
                type: https://credit.example/problems/concurrent-modification
                title: Действие недоступно
                status: 409
                detail: Заявка только что изменилась — обновите данные и повторите действие

  schemas:
    Money:
      type: string
      pattern: '^\d{1,15}\.\d{2}$'
      description: Сумма в рублях, строкой с двумя знаками после точки (до 15 цифр до точки)
      example: '1500000.00'

    Role:
      type: string
      enum: [CLIENT, UNDERWRITER]

    ApplicationStatus:
      type: string
      description: Статус заявки. Подписи — в `GET /dictionaries`.
      enum:
        - DRAFT
        - SUBMITTED
        - ENRICHMENT
        - SCORING
        - NEED_INFO
        - MANUAL_REVIEW
        - APPROVED
        - COUNTER_OFFER
        - PENDING_CONFIRMATION
        - OFFER_ACCEPTED
        - SIGNED
        - DISBURSED
        - REJECTED
        - OFFER_DECLINED
        - OFFER_EXPIRED
        - CANCELLED

    ApplicationAction:
      type: string
      description: Действие клиента, доступное в текущем статусе (какие кнопки показывать)
      enum: [EDIT, SUBMIT, CANCEL, RESPOND_INFO, UPLOAD_DOCUMENT, ACCEPT_OFFER, DECLINE_OFFER, SIGN]

    Purpose:
      type: string
      enum: [WORKING_CAPITAL, EQUIPMENT, CASH_GAP, REFINANCING, STARTUP]

    ProductCode:
      type: string
      enum: [LUMP_SUM_LOAN, CREDIT_LINE, OVERDRAFT, GAMMA_START]

    FundingMode:
      type: string
      enum: [LUMP_SUM, TRANCHES, ON_DEMAND]

    RepaymentType:
      type: string
      enum: [ANNUITY, INTEREST_ONLY]

    RateUnit:
      type: string
      enum: [PERCENT_PER_YEAR, PERCENT_PER_DAY]

    TermUnit:
      type: string
      description: Единица срока. При сравнении сроков в разных единицах месяц считается за 30 дней.
      enum: [MONTHS, DAYS]

    TermKind:
      type: string
      description: |
        Что ограничивает срок продукта: `LOAN` — срок всего кредита (кредит одной суммой);
        `TRANCHE` — срок одного транша в рамках договора (линия, овердрафт, Гамма-Старт).
      enum: [LOAN, TRANCHE]

    BusinessType:
      type: string
      enum: [IP, LLC]

    CompanyStatus:
      type: string
      enum: [ACTIVE, LIQUIDATING, LIQUIDATED]

    DocumentType:
      type: string
      enum: [FINANCIAL_STATEMENT, BANK_STATEMENT, CHARTER, OTHER]

    ActorType:
      type: string
      enum: [CLIENT, SYSTEM, EMPLOYEE]

    DemoLoginRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/Role'

    LoginResponse:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          description: Время жизни токена, секунд
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id, fullName, role]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        companies:
          type: array
          description: |
            Компании, с которыми работает клиент; текущая выбирается переключателем в кабинете.
            Только для роли `CLIENT`, у сотрудника банка поля нет.
          items:
            $ref: '#/components/schemas/UserCompany'

    UserCompany:
      type: object
      required: [id, name, inn, businessType]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        inn:
          type: string
          pattern: '^(\d{10}|\d{12})$'
        businessType:
          $ref: '#/components/schemas/BusinessType'
        demoScenario:
          type: string
          description: 'Только в демо — подпись сценария в переключателе компании («Одобрение», «Отказ: просрочка»…)'

    DictionaryItem:
      type: object
      required: [code, label]
      properties:
        code:
          type: string
        label:
          type: string
        description:
          type: string

    Dictionaries:
      type: object
      properties:
        purposes:
          type: array
          items: { $ref: '#/components/schemas/DictionaryItem' }
        fundingModes:
          type: array
          items: { $ref: '#/components/schemas/DictionaryItem' }
        repaymentTypes:
          type: array
          items: { $ref: '#/components/schemas/DictionaryItem' }
        applicationStatuses:
          type: array
          items: { $ref: '#/components/schemas/DictionaryItem' }
        reasonCodes:
          type: array
          items: { $ref: '#/components/schemas/DictionaryItem' }

    Product:
      type: object
      required: [code, name, minAmount, maxAmount, termKind, termUnit, minTerm, maxTerm, autoRenewal, rateUnit, baseRate, fundingModes, repaymentTypes, minBusinessAgeMonths]
      properties:
        code:
          $ref: '#/components/schemas/ProductCode'
        name:
          type: string
        description:
          type: string
        minAmount:
          $ref: '#/components/schemas/Money'
        maxAmount:
          $ref: '#/components/schemas/Money'
        termKind:
          $ref: '#/components/schemas/TermKind'
        termUnit:
          $ref: '#/components/schemas/TermUnit'
        minTerm:
          type: integer
          description: Минимальный срок (кредита или транша — см. `termKind`) в единицах `termUnit`
        maxTerm:
          type: integer
          description: Максимальный срок на базовых условиях
        maxTermWithSubscription:
          type: integer
          description: Максимальный срок с подпиской; нет поля — подписка срок не увеличивает
        agreementTermMonths:
          type: integer
          description: |
            Срок договора (лимита), месяцев — у линий, где срок ограничивает транш.
            У кредита одной суммой поля нет: срок договора равен сроку кредита.
        autoRenewal:
          type: boolean
          description: Договор продлевается автоматически
        rateUnit:
          $ref: '#/components/schemas/RateUnit'
        baseRate:
          type: number
          description: Базовая ставка, % (в год или в день — см. `rateUnit`). Кнопка «Оформить»
        rateWithSubscription:
          type: number
          description: |
            Ставка с подпиской, % — показывается серым рядом с базовой. Кнопка «Оформить с подпиской».
            Нет поля — подписка к продукту недоступна
        subscriptionDescription:
          type: string
          description: Что даёт и сколько стоит подписка — текст для карточки продукта
        subscriptionFeePercent:
          type: number
          description: |
            Комиссия за подписку, % от суммы кредита (лимита), единоразово при выдаче.
            Нет поля — подписка без комиссии
        fundingModes:
          type: array
          items: { $ref: '#/components/schemas/FundingMode' }
        repaymentTypes:
          type: array
          items: { $ref: '#/components/schemas/RepaymentType' }
        minBusinessAgeMonths:
          type: integer

    ProductRef:
      type: object
      required: [code, name]
      properties:
        code:
          $ref: '#/components/schemas/ProductCode'
        name:
          type: string

    ProductMatchRequest:
      type: object
      description: Подписку не передают — подбор проверяет оба варианта сам
      required: [companyId, purpose, requestedAmount, term, termUnit, fundingMode]
      properties:
        companyId:
          type: string
          format: uuid
          description: Компания, для которой подбираем (из `user.companies`)
        purpose:
          $ref: '#/components/schemas/Purpose'
        requestedAmount:
          $ref: '#/components/schemas/Money'
        term:
          type: integer
          minimum: 1
        termUnit:
          $ref: '#/components/schemas/TermUnit'
        fundingMode:
          $ref: '#/components/schemas/FundingMode'

    ProductMatchResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [product, suitable, requiresSubscription, recommended, reasons]
            properties:
              product:
                $ref: '#/components/schemas/ProductRef'
              suitable:
                type: boolean
                description: Подходит на базовых условиях
              requiresSubscription:
                type: boolean
                description: Подходит только с подпиской (при этом `suitable` = false)
              recommended:
                type: boolean
              reasons:
                type: array
                description: |
                  Почему продукт не подходит, а если подходит только с подпиской — почему и что она даёт.
                  Пусто, если продукт подходит на базовых условиях
                items:
                  type: string
              estimate:
                allOf: [{ $ref: '#/components/schemas/PaymentEstimate' }]
                description: Только у подходящих продуктов (`suitable` или `requiresSubscription`)

    PaymentEstimate:
      type: object
      required: [repaymentType]
      description: |
        Предварительный расчёт платежа по сумме и сроку из подбора — так же, как в предложении. Итоговый платёж —
        в `offer.monthlyPayment` после решения банка. Для линий и овердрафта — проценты при полном использовании лимита.
      properties:
        monthlyPayment:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Без подписки; нет поля, если продукт подходит только с подпиской
        monthlyPaymentWithSubscription:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: С подпиской; нет поля, если у продукта нет подписки
        subscriptionFee:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Комиссия за подписку, единоразово при выдаче; нет поля — без комиссии. В платёж не входит
        repaymentType:
          allOf: [{ $ref: '#/components/schemas/RepaymentType' }]
          description: По какому способу погашения посчитано — основной способ продукта

    Company:
      type: object
      required: [id, inn, ogrn, businessType, name, registrationDate, status]
      properties:
        id:
          type: string
          format: uuid
        inn:
          type: string
          pattern: '^(\d{10}|\d{12})$'
        ogrn:
          type: string
          pattern: '^(\d{13}|\d{15})$'
        businessType:
          $ref: '#/components/schemas/BusinessType'
        name:
          type: string
        registrationDate:
          type: string
          format: date
        businessAgeMonths:
          type: integer
          description: Считает бэкенд
        okved:
          type: string
        region:
          type: string
        status:
          $ref: '#/components/schemas/CompanyStatus'

    Financials:
      type: object
      description: Финансовые данные из анкеты. Незаполненных полей в ответе нет
      properties:
        annualRevenue:
          $ref: '#/components/schemas/Money'
        annualExpenses:
          $ref: '#/components/schemas/Money'
        bankMonthlyTurnover:
          $ref: '#/components/schemas/Money'
        monthlyDebtPayment:
          $ref: '#/components/schemas/Money'

    ApplicationCreateRequest:
      type: object
      description: Черновик заявки. Обязательна только компания, остальное можно заполнить позже через PATCH
      required: [companyId]
      properties:
        companyId:
          type: string
          format: uuid
          description: Компания из `user.companies`; после создания не меняется
        productCode:
          $ref: '#/components/schemas/ProductCode'
        purpose:
          $ref: '#/components/schemas/Purpose'
        requestedAmount:
          $ref: '#/components/schemas/Money'
        term:
          type: integer
          minimum: 1
          description: Срок, который просит клиент; передаётся вместе с `termUnit`
        termUnit:
          $ref: '#/components/schemas/TermUnit'
        fundingMode:
          $ref: '#/components/schemas/FundingMode'
        repaymentType:
          $ref: '#/components/schemas/RepaymentType'
        financials:
          $ref: '#/components/schemas/Financials'
        collateral:
          type: boolean
          description: В MVP всегда false
        subscription:
          type: boolean
          description: Кнопка на карточке продукта — «Оформить» (`false`) или «Оформить с подпиской» (`true`)

    ApplicationPatchRequest:
      type: object
      description: JSON Merge Patch. `term` и `termUnit` меняются вместе, компанию заявки изменить нельзя.
      properties:
        productCode:
          type: string
          enum: [LUMP_SUM_LOAN, CREDIT_LINE, OVERDRAFT, GAMMA_START, null]
          nullable: true
        purpose:
          type: string
          enum: [WORKING_CAPITAL, EQUIPMENT, CASH_GAP, REFINANCING, STARTUP, null]
          nullable: true
        requestedAmount:
          type: string
          pattern: '^\d{1,15}\.\d{2}$'
          nullable: true
          description: Сумма в рублях, строкой с двумя знаками после точки
        term:
          type: integer
          minimum: 1
          nullable: true
        termUnit:
          type: string
          enum: [MONTHS, DAYS, null]
          nullable: true
        fundingMode:
          type: string
          enum: [LUMP_SUM, TRANCHES, ON_DEMAND, null]
          nullable: true
        repaymentType:
          type: string
          enum: [ANNUITY, INTEREST_ONLY, null]
          nullable: true
        financials:
          type: object
          nullable: true
          description: Сливается по полям; `null` — очистить все финансовые данные
          properties:
            annualRevenue:
                type: string
                pattern: '^\d{1,15}\.\d{2}$'
                nullable: true
                description: Выручка за последние 12 месяцев
            annualExpenses:
                type: string
                pattern: '^\d{1,15}\.\d{2}$'
                nullable: true
                description: Расходы за последние 12 месяцев
            bankMonthlyTurnover:
                type: string
                pattern: '^\d{1,15}\.\d{2}$'
                nullable: true
                description: Средние обороты по счёту в банке в месяц
            monthlyDebtPayment:
                type: string
                pattern: '^\d{1,15}\.\d{2}$'
                nullable: true
                description: Ежемесячный платёж по текущим кредитам
        collateral:
          type: boolean
          description: В MVP всегда false
        subscription:
          type: boolean
          description: Оформить с подпиской

    Reason:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: OVERDUE_GT_60
        message:
          type: string
          description: Текст для клиента
        advice:
          type: string
          description: |
            Совет клиенту, что делать дальше («Погасите просрочку и подайте заявку снова через 3 месяца»), — у причин
            отказа и контрпредложения; нет поля — совета нет. Показывать отдельно от `message`

    Offer:
      type: object
      required: [productCode, productName, amount, term, termUnit, termKind, rate, rateUnit, subscription, preliminary, expiresAt]
      properties:
        productCode:
          $ref: '#/components/schemas/ProductCode'
        productName:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        term:
          type: integer
          description: Срок кредита или транша (как `termKind` продукта)
        termUnit:
          $ref: '#/components/schemas/TermUnit'
        termKind:
          allOf: [{ $ref: '#/components/schemas/TermKind' }]
          description: |
            `LOAN` — `term` это срок возврата всей суммы («500 000 ₽ на 24 месяца»); `TRANCHE` — срок одного транша
            в пределах лимита («лимит 800 000 ₽, транши до 60 дней»)
        agreementTermMonths:
          type: integer
          description: Срок договора (лимита), месяцев; у кредита одной суммой поля нет
        rate:
          type: number
        rateUnit:
          $ref: '#/components/schemas/RateUnit'
        monthlyPayment:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |
            Ежемесячный платёж (для линий и овердрафта — проценты при полном использовании лимита).
            Комиссию за подписку не включает
        subscription:
          type: boolean
          description: Одобрено на условиях с подпиской
        subscriptionFee:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Комиссия за подписку, единоразово при выдаче; нет поля — без комиссии
        preliminary:
          type: boolean
          description: true — предварительное одобрение, после согласия клиента условия подтверждает андеррайтер
        expiresAt:
          type: string
          format: date-time
          description: До какого момента клиент может принять предложение; в `PENDING_CONFIRMATION` не истекает

    InfoRequest:
      type: object
      required: [id, message, requestedFields, requestedDocuments, createdBy, createdAt, status]
      properties:
        id:
          type: string
          format: uuid
        message:
          type: string
        requestedFields:
          type: array
          description: Поля анкеты, которые нужно заполнить, — путь через точку, как в `ApplicationPatchRequest` (`financials.annualRevenue`)
          items:
            type: string
        requestedDocuments:
          type: array
          items:
            $ref: '#/components/schemas/DocumentType'
        createdBy:
          type: string
          enum: [SYSTEM, EMPLOYEE]
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [OPEN, ANSWERED]
        response:
          type: string
          description: Ответ клиента; нет поля, пока клиент не ответил

    InfoRequestResponse:
      type: object
      properties:
        comment:
          type: string
          maxLength: 2000
        documentIds:
          type: array
          description: |
            Загруженные документы этой заявки, ещё не приложенные к другому ответу (иначе 400 по `documentIds[i]`).
            Если в запросе есть `requestedDocuments`, нужен хотя бы один документ каждого типа (иначе 400 по
            `documentIds`)
          items:
            type: string
            format: uuid

    CreateInfoRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          maxLength: 2000
        requestedFields:
          type: array
          items:
            type: string
        requestedDocuments:
          type: array
          items:
            $ref: '#/components/schemas/DocumentType'

    Application:
      type: object
      required: [id, number, status, companyId, availableActions, reasons, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          example: CR-2026-000123
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        companyId:
          type: string
          format: uuid
        productCode:
          $ref: '#/components/schemas/ProductCode'
        purpose:
          $ref: '#/components/schemas/Purpose'
        requestedAmount:
          $ref: '#/components/schemas/Money'
        term:
          type: integer
          description: Срок, который просит клиент, в единицах `termUnit`
        termUnit:
          $ref: '#/components/schemas/TermUnit'
        fundingMode:
          $ref: '#/components/schemas/FundingMode'
        repaymentType:
          $ref: '#/components/schemas/RepaymentType'
        financials:
          $ref: '#/components/schemas/Financials'
        collateral:
          type: boolean
        subscription:
          type: boolean
          description: Клиент оформляет с подпиской
        offer:
          allOf: [{ $ref: '#/components/schemas/Offer' }]
          description: |
            Есть в статусах APPROVED, COUNTER_OFFER, PENDING_CONFIRMATION, OFFER_ACCEPTED, SIGNED, DISBURSED
            и OFFER_EXPIRED (просроченное предложение)
        openInfoRequest:
          allOf: [{ $ref: '#/components/schemas/InfoRequest' }]
          description: Есть в статусе NEED_INFO
        reasons:
          type: array
          description: Причины решения (отказ, ручная проверка, контрпредложение)
          items:
            $ref: '#/components/schemas/Reason'
        availableActions:
          type: array
          description: Какие действия доступны клиенту сейчас — по нему фронт показывает кнопки
          items:
            $ref: '#/components/schemas/ApplicationAction'
        nextStepHint:
          type: string
          description: Подсказка клиенту, что делать дальше
        createdAt:
          type: string
          format: date-time
        submittedAt:
          type: string
          format: date-time
          description: Нет поля, пока заявка не отправлена
        updatedAt:
          type: string
          format: date-time

    ApplicationSummary:
      type: object
      required: [id, number, status, companyId, companyName, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        companyId:
          type: string
          format: uuid
        companyName:
          type: string
        purpose:
          $ref: '#/components/schemas/Purpose'
        productCode:
          $ref: '#/components/schemas/ProductCode'
        requestedAmount:
          $ref: '#/components/schemas/Money'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        unreadNotifications:
          type: integer

    StatusHistoryItem:
      type: object
      required: [toStatus, actorType, createdAt]
      properties:
        fromStatus:
          allOf: [{ $ref: '#/components/schemas/ApplicationStatus' }]
          description: Нет поля у первой записи (создание черновика)
        toStatus:
          $ref: '#/components/schemas/ApplicationStatus'
        actorType:
          $ref: '#/components/schemas/ActorType'
        actorName:
          type: string
          description: Имя сотрудника банка (`actorType = EMPLOYEE`); только в карточке бэк-офиса
        comment:
          type: string
        createdAt:
          type: string
          format: date-time

    Document:
      type: object
      required: [id, documentType, fileName, mimeType, sizeBytes, uploadedAt]
      properties:
        id:
          type: string
          format: uuid
        documentType:
          $ref: '#/components/schemas/DocumentType'
        fileName:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
        uploadedAt:
          type: string
          format: date-time
        infoRequestId:
          type: string
          format: uuid
          description: К ответу на какой запрос сведений приложен; нет поля — ещё не приложен

    SigningCodeResponse:
      type: object
      required: [expiresAt]
      properties:
        expiresAt:
          type: string
          format: date-time
        demoCode:
          type: string
          description: Только в демо-режиме — код для показа на экране

    Notification:
      type: object
      required: [id, type, title, body, read, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [APPLICATION_SUBMITTED, INFO_REQUESTED, DECISION_MADE, OFFER_CONFIRMED, OFFER_EXPIRED, SIGNED, DISBURSED, STATUS_CHANGED]
        title:
          type: string
        body:
          type: string
        applicationId:
          type: string
          format: uuid
          description: Нет поля, если уведомление не о заявке
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time

    ManualDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [APPROVE, COUNTER_OFFER, REJECT]
        productCode:
          $ref: '#/components/schemas/ProductCode'
        amount:
          $ref: '#/components/schemas/Money'
        term:
          type: integer
          minimum: 1
          description: Передаётся вместе с `termUnit`
        termUnit:
          $ref: '#/components/schemas/TermUnit'
        rate:
          type: number
          description: Ставка в единицах продукта (`rateUnit`), до сотых; нет поля — по каталогу
        comment:
          type: string
          maxLength: 2000
          description: |
            Этот текст увидит клиент — в причине решения (`MANUAL_REJECT`, `MANUAL_COUNTER_OFFER`) и в истории заявки.
            Обязателен для `REJECT` и `COUNTER_OFFER`
        reasonCodes:
          type: array
          items:
            type: string

    BackofficeApplicationSummary:
      type: object
      required: [id, number, status, companyName, inn]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        companyName:
          type: string
        inn:
          type: string
        productCode:
          $ref: '#/components/schemas/ProductCode'
        requestedAmount:
          $ref: '#/components/schemas/Money'
        score:
          type: integer
          description: Нет поля, если скоринг не считался
        grade:
          type: string
          enum: [A, B, C, D, E]
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/Reason'
        submittedAt:
          type: string
          format: date-time
        waitingSince:
          type: string
          format: date-time
          description: С какого момента заявка ждёт в очереди

    SourceResult:
      type: object
      required: [source, status]
      properties:
        source:
          type: string
          enum: [EGRUL, FNS, BKI]
        status:
          type: string
          enum: [OK, NOT_FOUND, ERROR, TIMEOUT]
        receivedAt:
          type: string
          format: date-time
          description: Нет поля, если источник не ответил

    Enrichment:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceResult'
        taxDebtAmount:
          $ref: '#/components/schemas/Money'
        activeCreditsCount:
          type: integer
        totalDebtAmount:
          $ref: '#/components/schemas/Money'
        maxOverdueDays12m:
          type: integer

    ScoringFactor:
      type: object
      required: [factor, points]
      description: |
        Фактор скоринга (docs/scoring.md): `PROFITABILITY`, `DEBT_LOAD`, `OVERDUE_DAYS`, `TAX_DEBT`, `BUSINESS_AGE`,
        `ACTIVE_CREDITS`; `NORMALIZATION` — поправка до шкалы 0–100, когда финансовые факторы не считались.
        Сумма `points` всех факторов равна `score`.
      properties:
        factor:
          type: string
          example: OVERDUE_DAYS
        inputValue:
          type: string
          description: Значение, по которому начислены баллы (проценты — числом); нет поля, если входных данных нет
        points:
          type: integer
        maxPoints:
          type: integer
          description: Максимум фактора; у `NORMALIZATION` — 0
        explanation:
          type: string

    Scoring:
      type: object
      required: [score, factors]
      properties:
        score:
          type: integer
        grade:
          type: string
          enum: [A, B, C, D, E]
        factors:
          type: array
          items:
            $ref: '#/components/schemas/ScoringFactor'

    BackofficeApplicationDetail:
      type: object
      required: [application, company, infoRequests, documents, history]
      properties:
        application:
          $ref: '#/components/schemas/Application'
        company:
          $ref: '#/components/schemas/Company'
        enrichment:
          $ref: '#/components/schemas/Enrichment'
        scoring:
          allOf: [{ $ref: '#/components/schemas/Scoring' }]
          description: Нет поля, если скоринг не считался (например, источник не ответил)
        infoRequests:
          type: array
          description: Все запросы сведений по заявке, старые первыми
          items:
            $ref: '#/components/schemas/InfoRequest'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        history:
          type: array
          items:
            $ref: '#/components/schemas/StatusHistoryItem'

    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer

    ApplicationSummaryPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/ApplicationSummary'

    BackofficeApplicationSummaryPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/BackofficeApplicationSummary'

    NotificationPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Notification'

    Problem:
      type: object
      description: Problem Details (RFC 9457)
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        expiresAt:
          type: string
          format: date-time
          description: Только для `…/offer-expired` — до какого момента действовало предложение
        errors:
          type: array
          description: Ошибки по полям (для 400)
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
                description: Путь к полю через точку (`financials.annualRevenue`), у элемента массива — с индексом (`documentIds[0]`)
                example: financials.annualRevenue
              message:
                type: string
