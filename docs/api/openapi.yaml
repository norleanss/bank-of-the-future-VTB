openapi: 3.0.3
info:
  title: Кредитный конвейер МСБ — API
  version: 0.2.3-draft
  description: |
    API кредитного конвейера для малого бизнеса: кабинет клиента и бэк-офис банка.

    Соглашения:
    - Пути начинаются с `/api/v1`, авторизация — `Authorization: Bearer <accessToken>` из `POST /auth/demo-login`.
    - Даты — ISO 8601 с часовым поясом (`2026-10-22T14:05:00+03:00`), даты без времени — `ГГГГ-ММ-ДД`.
    - Деньги — строкой с двумя знаками (`"1500000.00"`), чтобы JavaScript не терял точность.
    - Ставки — числом в процентах (`23.50`), единица — в `rateUnit`.
    - Сроки — `term` + `termUnit` (`MONTHS` / `DAYS`); при сравнении месяц = 30 дней.
    - Коды — на английском, русские подписи — `GET /dictionaries`.
    - В ответах нет `null`: поле без значения отсутствует.
    - `PATCH` — JSON Merge Patch (RFC 7386): поле не передано — не меняется, `null` — очищается,
      вложенные объекты сливаются по полям.
    - Ошибки — Problem Details (RFC 9457); в `errors[].field` — путь через точку (`financials.annualRevenue`,
      `documentIds[0]`).
    - Пагинация — `page` (с 0) и `size`, ответ в обёртке `...Page`.
servers:
  - url: http://localhost:8080/api/v1
    description: Локальный бэкенд
  - url: http://localhost:4010
    description: Мок-сервер Prism (без префикса /api/v1)
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Вход-заглушка для демо
  - name: Dictionaries
    description: Справочники с русскими подписями кодов
  - name: Products
    description: Каталог и подбор кредитных продуктов
  - name: Company
    description: Компании текущего клиента
  - name: Applications
    description: Заявки клиента
  - name: Notifications
    description: Уведомления в кабинете
  - name: Backoffice
    description: Обработка заявок сотрудником банка (андеррайтером)

paths:
  /auth/demo-login:
    post:
      tags: [Auth]
      summary: Войти как демо-пользователь выбранной роли
      description: |
        Демо-вход без пароля: токен заранее созданного пользователя выбранной роли.
        У демо-клиента несколько компаний (по одной на сценарий) — `user.companies`.
      security: []
      operationId: demoLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoLoginRequest'
            examples:
              client:
                value: { role: CLIENT }
              underwriter:
                value: { role: UNDERWRITER }
      responses:
        '200':
          description: Токен и пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                client:
                  value:
                    accessToken: eyJhbGciOiJIUzI1NiJ9.demo-client
                    expiresIn: 86400
                    user:
                      id: 7d1f3c2e-1b2a-4c5d-8e9f-0a1b2c3d4e5f
                      fullName: Иван Петров
                      role: CLIENT
                      companies:
                        - id: 3f2a9c1e-5b7d-4e8a-9c21-7d4e5f6a8b90
                          name: ООО «Северный ветер»
                          inn: '7841256395'
                          businessType: LLC
                          demoScenario: Одобрение
                        - id: 118ffe67-739c-4053-94df-9024ddfa44a5
                          name: ИП Морозов Дмитрий Олегович
                          inn: '526218493785'
                          businessType: IP
                          demoScenario: Ручная проверка
                        - id: bd88f8b9-b915-49ff-ab95-85658a48d64b
                          name: ООО «Альтаир»
                          inn: '6673482158'
                          businessType: LLC
                          demoScenario: 'Отказ: просрочка'
                        - id: 21a1be18-cb82-4fed-b463-8f7f5059fb6e
                          name: ООО «ТехноПром»
                          inn: '5406217388'
                          businessType: LLC
                          demoScenario: Предварительное одобрение
                        - id: 9b6d2f4a-8c1e-4a7b-b3d5-2e9f0a1c7d64
                          name: ИП Соколова Анна Викторовна
                          inn: '165809341759'
                          businessType: IP
                          demoScenario: Гамма-Старт
                        - id: c4e8a1b7-2d9f-4f3c-8a6e-5b0d7c2f9e13
                          name: ООО «Вектор-Строй»
                          inn: '7724185366'
                          businessType: LLC
                          demoScenario: 'Отказ: ликвидация'
                underwriter:
                  value:
                    accessToken: eyJhbGciOiJIUzI1NiJ9.demo-underwriter
                    expiresIn: 86400
                    user:
                      id: 5c3e7a9d-1f4b-4b2e-8d6a-9e2c4f7b1a38
                      fullName: Мария Смирнова
                      role: UNDERWRITER
        '400':
