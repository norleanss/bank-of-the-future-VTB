      description: |
        Разрешено в `DRAFT` и `NEED_INFO`. `"financials": {"annualExpenses": null}` очищает только расходы,
        `"financials": null` — все финансовые данные. `term` и `termUnit` меняются вместе; `companyId` в запросе — 400.
        В `NEED_INFO` меняются только `financials` и поля из `openInfoRequest.requestedFields`; `productCode`,
        `requestedAmount`, `term`, `termUnit` и `subscription` после отправки не меняются. Иначе — 400 с этими полями
        в `errors`; переданное то же значение изменением не считается.
      operationId: updateApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationPatchRequest'
            example:
              repaymentType: INTEREST_ONLY
              financials:
                annualRevenue: '17434414.00'
                annualExpenses: null
                bankMonthlyTurnover: '1450000.00'
              subscription: true
      responses:
