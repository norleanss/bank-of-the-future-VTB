# SSE authenticates with a query parameter; keep query strings out of access logs.
log_format credit_access '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent';

server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log credit_access;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/v1/ {
        # Re-resolve the service after Docker recreates a backend container.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend http://backend:8080;
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE events must reach EventSource immediately. Heartbeats arrive every 30s.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
