        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /applications/{id}/submit:
    post:
      tags: [Applications]
      summary: Отправить заявку
      description: |
        Проверяет полноту и условия продукта (сумма, срок с учётом подписки, возраст бизнеса компании)
        и переводит заявку в `SUBMITTED`; несоответствие — 400 с полем в `errors`.
        Дальше асинхронно: `ENRICHMENT` (ЕГРЮЛ, ФНС, БКИ) → `SCORING` → решение — обычно за несколько секунд;
        статус читать через `GET /applications/{id}`. Повторная отправка безопасна.
      operationId: submitApplication
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '202':
          description: Заявка принята в обработку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /applications/{id}/cancel:
    post:
      tags: [Applications]
      summary: Отменить заявку
      description: Разрешено в `DRAFT`, `NEED_INFO`, `MANUAL_REVIEW`. От предложения в `APPROVED`/`COUNTER_OFFER` клиент отказывается через `offer/decline`.
      operationId: cancelApplication
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Заявка отменена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /applications/{id}/history:
    get:
      tags: [Applications]
      summary: История статусов заявки
      operationId: getApplicationHistory
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Переходы статусов, от старых к новым
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StatusHistoryItem'
              example:
                - { toStatus: DRAFT, actorType: CLIENT, createdAt: '2026-10-22T14:05:00+03:00' }
                - { fromStatus: DRAFT, toStatus: SUBMITTED, actorType: CLIENT, createdAt: '2026-10-22T14:05:40+03:00' }
                - { fromStatus: SUBMITTED, toStatus: ENRICHMENT, actorType: SYSTEM, createdAt: '2026-10-22T14:05:41+03:00' }
                - { fromStatus: ENRICHMENT, toStatus: SCORING, actorType: SYSTEM, createdAt: '2026-10-22T14:05:55+03:00' }
                - { fromStatus: SCORING, toStatus: APPROVED, actorType: SYSTEM, createdAt: '2026-10-22T14:06:10+03:00' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /applications/{id}/documents:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    get:
      tags: [Applications]
      summary: Документы заявки
      description: Все загруженные документы заявки, старые первыми.
      operationId: listDocuments
      responses:
        '200':
          description: Документы
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Applications]
      summary: Загрузить документ
      description: |
        Разрешено, когда в `availableActions` есть `UPLOAD_DOCUMENT` (`NEED_INFO`), иначе 409. Форматы — PDF, JPG,
        PNG (проверяется и содержимое файла, а не только расширение), размер — до 10 МБ, документов у заявки — до 20;
        лимиты настраиваются на сервере. Неверный формат, пустой файл или лишний документ — 400 по полю `file`,
        больше лимита размера — 413. Документ прикладывают к ответу на запрос сведений (`documentIds`).
      operationId: uploadDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, documentType]
              properties:
                file:
                  type: string
                  format: binary
                documentType:
                  $ref: '#/components/schemas/DocumentType'
      responses:
        '201':
          description: Документ загружен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
              example:
                id: 6f7a8b9c-0d1e-4f2a-8b3c-4d5e6f7a8b9c
                documentType: FINANCIAL_STATEMENT
                fileName: отчётность_2025.pdf
                mimeType: application/pdf
                sizeBytes: 482113
                uploadedAt: '2026-10-22T15:10:00+03:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: Файл слишком большой
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /applications/{id}/documents/{documentId}/content:
    get:
      tags: [Applications]
      summary: Скачать документ
      description: Файл как загружен; имя — в `Content-Disposition`.
      operationId: downloadDocument
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Файл
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /applications/{id}/info-requests/{requestId}/response:
    post:
      tags: [Applications]
      summary: Ответить на запрос банка
      description: |
        Перед ответом клиент дозаполняет поля через `PATCH /applications/{id}`
        и при необходимости загружает документы. Ответ закрывает запрос. Запрос системы (`createdBy: SYSTEM`) —
        заявка снова уходит в обработку (`ENRICHMENT`); запрос сотрудника (`EMPLOYEE`) — возвращается к нему
        (`MANUAL_REVIEW`). Незаполненные поля из `requestedFields` — 400 с полями в `errors`; `requestId`
        не открытого запроса — 404. Если после отправки изменились условия продукта (продукт снят, сумма или срок
        вне условий) — клиент это исправить не может, поэтому ответ принимается, а заявка уходит в `MANUAL_REVIEW`
        с причиной `PRODUCT_CONDITIONS_CHANGED`.
      operationId: respondInfoRequest
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InfoRequestResponse'
            example:
              comment: Добавил выручку и расходы за 12 месяцев
              documentIds: []
      responses:
        '200':
          description: Заявка после ответа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /applications/{id}/offer/accept:
    post:
      tags: [Applications]
      summary: Принять предложение
      description: |
        Обычное одобрение — `OFFER_ACCEPTED`, предварительное — `PENDING_CONFIRMATION` (ждёт андеррайтера).
        Предложение действует 7 дней (`offer.expiresAt`), потом заявка уходит в `OFFER_EXPIRED`; принять просроченное —
        409 `…/offer-expired`. В `PENDING_CONFIRMATION` предложение не истекает.
      operationId: acceptOffer
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Заявка после принятия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Действие недоступно в текущем статусе, срок предложения истёк или заявку только что изменили
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                invalidTransition:
                  value:
                    type: https://credit.example/problems/invalid-transition
                    title: Действие недоступно
                    status: 409
                    detail: 'Нельзя принять предложение в статусе REJECTED'
                offerExpired:
                  value:
                    type: https://credit.example/problems/offer-expired
                    title: Срок предложения истёк
                    status: 409
                    detail: 'Предложение действовало до 29.10.2026. Вы можете подать новую заявку'
                    expiresAt: '2026-10-29T14:06:10+03:00'
                concurrentModification:
                  value:
                    type: https://credit.example/problems/concurrent-modification
                    title: Действие недоступно
                    status: 409
                    detail: Заявка только что изменилась — обновите данные и повторите действие

  /applications/{id}/offer/decline:
    post:
      tags: [Applications]
      summary: Отказаться от предложения
      operationId: declineOffer
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Заявка в статусе OFFER_DECLINED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /applications/{id}/signing/request-code:
    post:
      tags: [Applications]
      summary: Запросить код подписания (моделирование)
      description: |
        Моделирование подписи кодом подтверждения внутри интерфейса, без SMS. Разрешено в `OFFER_ACCEPTED`;
        новый код заменяет прежний. В демо код возвращается в ответе (`demoCode`), чтобы его можно было показать на экране.
      operationId: requestSigningCode
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Код выпущен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningCodeResponse'
              example:
                expiresAt: '2026-10-22T14:15:00+03:00'
                demoCode: '4821'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /applications/{id}/signing/confirm:
    post:
      tags: [Applications]
      summary: Подписать договор кодом (моделирование)
      description: |
        Разрешено в `OFFER_ACCEPTED`. Код действует 5 минут, на ввод — 3 попытки; неверный, просроченный
        или исчерпавший попытки код — 400 с `errors[{field: code}]` (запросите новый). После подписания (`SIGNED`)
        бэкенд моделирует выдачу, и заявка переходит в `DISBURSED`.
      operationId: confirmSigning
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  pattern: '^\d{4}$'
            example:
              code: '4821'
      responses:
        '200':
          description: Заявка после подписания
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /notifications:
    get:
      tags: [Notifications]
      summary: Уведомления текущего пользователя
      description: |
        Уведомления создаются при смене статуса заявки: отправка, запрос сведений, ручная проверка, решение,
        подтверждение условий, истечение предложения, подписание, выдача. О собственных действиях клиента
        (принял или отклонил предложение, отменил заявку) уведомлений нет. `unreadNotifications` в списке заявок —
        непрочитанные уведомления по заявке.
      operationId: listNotifications
      parameters:
        - name: unreadOnly
          in: query
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Страница уведомлений, новые первыми
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
              example:
                content:
                  - id: 8a9b0c1d-2e3f-4a5b-8c6d-7e8f9a0b1c2d
                    type: DECISION_MADE
                    title: Заявка одобрена
                    body: 'Одобрено 800 000 ₽ на 2 месяца. Ознакомьтесь с условиями.'
                    applicationId: 9b2c1d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
                    read: false
                    createdAt: '2026-10-22T14:06:10+03:00'
                page: 0
                size: 20
                totalElements: 1
                totalPages: 1

  /notifications/{id}/read:
    post:
      tags: [Notifications]
      summary: Отметить уведомление прочитанным
      operationId: markNotificationRead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Отмечено (повторная отметка — тоже 204)
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications/stream:
    get:
      tags: [Notifications]
      summary: Поток уведомлений (Server-Sent Events)
      description: |
        Для `EventSource`: `event: notification` (данные — схема `Notification`) и `event: ping` раз в 30 секунд.
        Токен — параметром `access_token`: `EventSource` не умеет заголовки. Сразу после подключения приходит
        `ping`; при обрыве `EventSource` переподключается сам, пропущенное — в `GET /notifications`.
        Prism поток не имитирует.
      operationId: streamNotifications
      # Генератор не создаёт метод для этой операции: поток отдаётся вручную (SseEmitter)
      x-internal: true
      security: []
      parameters:
        - name: access_token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Поток событий
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: notification
                data: {"id":"8a9b0c1d-2e3f-4a5b-8c6d-7e8f9a0b1c2d","type":"DECISION_MADE","title":"Заявка одобрена","body":"Одобрено 800 000 ₽ на 2 месяца.","applicationId":"9b2c1d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e","read":false,"createdAt":"2026-10-22T14:06:10+03:00"}
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backoffice/applications:
    get:
      tags: [Backoffice]
      summary: Очередь заявок для сотрудника банка
      description: |
        Доступно роли `UNDERWRITER`. Очереди:
        `REVIEW` — заявки в `MANUAL_REVIEW`; `CONFIRMATION` — в `PENDING_CONFIRMATION` (в обеих — дольше всех
        ждущие первыми, по `waitingSince`); `ALL` — все отправленные заявки, без черновиков (новые первыми, по
        `submittedAt`; фильтр `status`). `status` сужает и очереди `REVIEW`/`CONFIRMATION`.
      operationId: listBackofficeApplications
      parameters:
        - name: queue
          in: query
          schema:
            type: string
            enum: [REVIEW, CONFIRMATION, ALL]
            default: REVIEW
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ApplicationStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Страница заявок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackofficeApplicationSummaryPage'
              example:
                content:
                  - id: 4f5a6b7c-8d9e-4f0a-8b1c-2d3e4f5a6b7c
                    number: CR-2026-000127
                    status: MANUAL_REVIEW
                    companyName: ООО «Северный ветер»
                    inn: '7841256395'
                    productCode: CREDIT_LINE
                    requestedAmount: '2500000.00'
                    score: 57
                    grade: C
                    reasons:
                      - { code: SCORE_GREY_ZONE, message: 'Требуется дополнительная проверка специалистом' }
                    submittedAt: '2026-10-22T16:20:00+03:00'
                    waitingSince: '2026-10-22T16:20:30+03:00'
                page: 0
                size: 20
                totalElements: 1
                totalPages: 1
        '403':
          $ref: '#/components/responses/Forbidden'

  /backoffice/applications/{id}:
    get:
      tags: [Backoffice]
      summary: Полная карточка заявки для сотрудника банка
      description: |
        Заявка, компания, данные внешних источников, скоринг с разбивкой по факторам, запросы сведений, документы
        и история с именами сотрудников. Данные источников и скоринг — последней проверки заявки.
      operationId: getBackofficeApplication
