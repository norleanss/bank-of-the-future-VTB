        '404':
          $ref: '#/components/responses/NotFound'

  /products/match:
    post:
      tags: [Products]
      summary: Подбор продукта по потребности клиента
      description: |
        Все продукты каталога с отметкой и причинами. Подписку не передают — проверяются оба варианта:
        `suitable` — подходит на базовых условиях, `requiresSubscription` — только с подпиской (что она даёт — в `reasons`).
        Рекомендован первый с `recommended: true`. Возраст бизнеса берётся по `companyId`.
        У подходящих продуктов — `estimate`: предварительный ежемесячный платёж по сумме и сроку из запроса,
        без подписки и с подпиской. Это ориентир для выбора: итоговый платёж — в `offer.monthlyPayment` после
        решения банка (сумма может быть меньше запрошенной).
      operationId: matchProducts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductMatchRequest'
            example:
              companyId: 3f2a9c1e-5b7d-4e8a-9c21-7d4e5f6a8b90
              purpose: CASH_GAP
              requestedAmount: '1500000.00'
              term: 75
              termUnit: DAYS
              fundingMode: ON_DEMAND
      responses:
        '200':
          description: Результат подбора
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductMatchResponse'
              example:
                items:
                  - product: { code: OVERDRAFT, name: Овердрафт для бизнеса }
                    suitable: false
                    requiresSubscription: true
                    recommended: true
                    reasons: ['Транш до 60 дней; с подпиской — до 90 дней, ставка от 13% вместо 26%, комиссия 1% от суммы']
                    estimate:
                      monthlyPaymentWithSubscription: '16250.00'
                      subscriptionFee: '15000.00'
                      repaymentType: INTEREST_ONLY
                  - product: { code: CREDIT_LINE, name: Возобновляемая кредитная линия }
                    suitable: true
                    requiresSubscription: false
                    recommended: false
                    reasons: []
                    estimate:
                      monthlyPayment: '29375.00'
                      monthlyPaymentWithSubscription: '18125.00'
                      repaymentType: INTEREST_ONLY
                  - product: { code: LUMP_SUM_LOAN, name: Кредит одной суммой }
                    suitable: false
                    requiresSubscription: false
                    recommended: false
                    reasons: ['Минимальный срок кредита — 12 месяцев', 'Выдаётся только всей суммой сразу']
                  - product: { code: GAMMA_START, name: Гамма-Старт }
                    suitable: false
                    requiresSubscription: false
                    recommended: false
                    reasons: ['Максимальная сумма — 1 000 000 ₽']
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

